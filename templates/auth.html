{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px;margin:auto">
<h1>{{ 'Create your account' if mode=='register' else 'Log in' }}</h1>
<form method="post">
{% if mode=='register' %}<label>Full name<input name="name" required style="width:100%"></label>{% endif %}
<label>Email<input name="email" type="email" required style="width:100%"></label>
<label>Password<input name="password" type="password" minlength="8" required style="width:100%"></label>
{% if mode=='register' %}<label>I am joining as
<select name="role" style="width:100%"><option value="mentee">A mentee looking for guidance</option><option value="mentor">A mentor offering guidance</option></select></label>{% endif %}
<p><button>{{ 'Create account' if mode=='register' else 'Log in' }}</button></p></form>
<p class="muted">{% if mode=='register' %}Already registered? <a href="{{ url_for('login') }}">Log in</a>{% else %}New here? <a href="{{ url_for('register') }}">Create an account</a>{% endif %}</p>
</div>{% endblock %}
